basePath: /api
definitions:
  audithandler.AuditLogResponse:
    properties:
      action:
        type: string
      actor:
        type: string
      details:
        additionalProperties: {}
        type: object
      id:
        type: integer
      resource:
        type: string
      timestamp:
        type: integer
    type: object
  databasehandler.ConfigPayload:
    properties:
      auto_conversion:
        type: string
      create_preview:
        type: boolean
    type: object
  databasehandler.DatabaseCreatePayload:
    properties:
      config:
        $ref: '#/definitions/databasehandler.ConfigPayload'
      content_type:
        type: string
      custom_fields:
        items:
          $ref: '#/definitions/databasehandler.DatabaseCustomField'
        type: array
      housekeeping:
        $ref: '#/definitions/databasehandler.HousekeepingPayload'
      n_max_queued:
        type: integer
      name:
        type: string
    type: object
  databasehandler.DatabaseCustomField:
    properties:
      id:
        type: integer
      is_indexed:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  databasehandler.DatabaseResponse:
    properties:
      config:
        $ref: '#/definitions/databasehandler.ConfigPayload'
      content_type:
        type: string
      custom_fields:
        items:
          $ref: '#/definitions/databasehandler.DatabaseCustomField'
        type: array
      housekeeping:
        $ref: '#/definitions/databasehandler.DatabaseResponseHK'
      id:
        type: string
      n_max_queued:
        type: integer
      name:
        type: string
      stats:
        $ref: '#/definitions/databasehandler.DatabaseResponseStats'
    type: object
  databasehandler.DatabaseResponseHK:
    properties:
      disk_space:
        description: e.g. "10G"
        type: string
      interval:
        description: e.g."10min"
        type: string
      max_age:
        description: e.g. "365d"
        type: string
    type: object
  databasehandler.DatabaseResponseStats:
    properties:
      entry_count:
        type: integer
      total_disk_space_bytes:
        type: integer
    type: object
  databasehandler.DatabaseUpdatePayload:
    properties:
      config:
        $ref: '#/definitions/databasehandler.ConfigPayload'
      housekeeping:
        $ref: '#/definitions/databasehandler.HousekeepingPayload'
      n_max_queued:
        type: integer
      name:
        type: string
    type: object
  databasehandler.HousekeepingPayload:
    properties:
      disk_space:
        type: string
      interval:
        type: string
      max_age:
        type: string
    type: object
  databasehandler.HousekeepingResponse:
    properties:
      database_id:
        type: string
      database_name:
        type: string
      entries_deleted:
        type: integer
      message:
        type: string
      space_freed_bytes:
        type: integer
    type: object
  entryhandler.BulkDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entryhandler.BulkDeleteResponse:
    properties:
      database_id:
        type: string
      deleted_count:
        type: integer
      errors:
        type: string
      message:
        type: string
      space_freed_bytes:
        type: integer
    type: object
  entryhandler.EntryResponse:
    properties:
      created_at:
        type: integer
      custom_fields:
        additionalProperties: {}
        type: object
      database_id:
        type: string
      filename:
        type: string
      filesize:
        type: integer
      id:
        type: integer
      media_fields:
        additionalProperties: {}
        type: object
      mime_type:
        type: string
      preview_filesize:
        type: integer
      status:
        type: string
      timestamp:
        type: integer
      updated_at:
        type: integer
    type: object
  entryhandler.ExportRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  entryhandler.FileJSONResponse:
    properties:
      data:
        description: Base64 encoded string with data URI prefix
        type: string
      filename:
        type: string
      mime_type:
        type: string
      size:
        type: integer
    type: object
  entryhandler.ImportResponse:
    properties:
      database_id:
        type: string
      message:
        type: string
    type: object
  entryhandler.PartialEntryResponse:
    properties:
      created_at:
        type: integer
      custom_fields:
        additionalProperties: {}
        type: object
      database_id:
        type: string
      id:
        type: integer
      mime_type:
        type: string
      status:
        type: string
      timestamp:
        type: integer
      updated_at:
        type: integer
    type: object
  entryhandler.PostPatchEntryRequest:
    properties:
      custom_fields:
        additionalProperties: {}
        type: object
      filename:
        type: string
      timestamp:
        type: integer
    type: object
  infohandler.FeaturesConfig:
    properties:
      audit_logs:
        type: boolean
    type: object
  infohandler.InfoResponse:
    properties:
      conversion_to:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      features:
        $ref: '#/definitions/infohandler.FeaturesConfig'
      oidc:
        $ref: '#/definitions/infohandler.OIDCConfig'
      service_name:
        type: string
      uptime:
        description: Changed to reflect elapsed duration
        type: string
      version:
        type: string
    type: object
  infohandler.OIDCConfig:
    properties:
      enabled:
        type: boolean
      login_page_disabled:
        type: boolean
      oidc_auth_endpoint:
        description: dynamically filled
        type: string
      oidc_client_id:
        type: string
      oidc_issuer_url:
        type: string
      oidc_redirect_url:
        type: string
    type: object
  repository.AccountType:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - AccountTypeLocal
    - AccountTypeService
    - AccountTypeOIDC
  repository.Condition:
    properties:
      field:
        type: string
      operator:
        description: e.g., "=", ">", "<", "LIKE"
        type: string
      value:
        description: '''any'' allows for strings, numbers, or booleans'
    type: object
  repository.FilterGroup:
    properties:
      conditions:
        description: The individual rules
        items:
          $ref: '#/definitions/repository.Condition'
        type: array
      operator:
        description: e.g., "and", "or"
        type: string
    type: object
  repository.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
    type: object
  repository.SearchRequest:
    properties:
      filter:
        $ref: '#/definitions/repository.FilterGroup'
      pagination:
        $ref: '#/definitions/repository.Pagination'
      sort:
        $ref: '#/definitions/repository.SortCriteria'
    type: object
  repository.SortCriteria:
    properties:
      direction:
        description: '"asc" or "desc"'
        type: string
      field:
        type: string
    type: object
  tokenhandler.OidcTokenExchangeRequest:
    properties:
      code:
        type: string
      code_verifier:
        type: string
      redirect_uri:
        type: string
    type: object
  tokenhandler.TokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  tokenhandler.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  userhandler.APIKeyCreatedResponse:
    properties:
      created_at:
        type: integer
      expires_at:
        description: nullable
        type: integer
      id:
        type: string
      key_hint:
        type: string
      last_used_at:
        description: nullable
        type: integer
      name:
        type: string
      scope_admin:
        type: boolean
      scope_create:
        type: boolean
      scope_delete:
        type: boolean
      scope_edit:
        type: boolean
      scope_view:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/userhandler.UserSubResponse'
    type: object
  userhandler.APIKeyResponse:
    properties:
      created_at:
        type: integer
      expires_at:
        description: nullable
        type: integer
      id:
        type: string
      key_hint:
        type: string
      last_used_at:
        description: nullable
        type: integer
      name:
        type: string
      scope_admin:
        type: boolean
      scope_create:
        type: boolean
      scope_delete:
        type: boolean
      scope_edit:
        type: boolean
      scope_view:
        type: boolean
      user:
        $ref: '#/definitions/userhandler.UserSubResponse'
    type: object
  userhandler.CreateAPIKeyPayload:
    properties:
      expires_at:
        type: integer
      name:
        type: string
      scope_admin:
        type: boolean
      scope_create:
        type: boolean
      scope_delete:
        type: boolean
      scope_edit:
        type: boolean
      scope_view:
        type: boolean
    type: object
  userhandler.CreateUserPayload:
    properties:
      account_type:
        $ref: '#/definitions/repository.AccountType'
      is_admin:
        type: boolean
      password:
        type: string
      permissions:
        items:
          $ref: '#/definitions/userhandler.DatabasePermission'
        type: array
      username:
        type: string
    type: object
  userhandler.DatabasePermission:
    properties:
      can_admin:
        type: boolean
      can_create:
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
      can_view:
        type: boolean
      database_id:
        type: string
    type: object
  userhandler.UpdateAPIKeyPayload:
    properties:
      expires_at:
        type: integer
      name:
        type: string
      scope_admin:
        type: boolean
      scope_create:
        type: boolean
      scope_delete:
        type: boolean
      scope_edit:
        type: boolean
      scope_view:
        type: boolean
    type: object
  userhandler.UpdateMePayload:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  userhandler.UpdateUserPayload:
    properties:
      is_admin:
        type: boolean
      password:
        type: string
      permissions:
        items:
          $ref: '#/definitions/userhandler.DatabasePermission'
        type: array
      username:
        type: string
    type: object
  userhandler.UserResponse:
    properties:
      account_type:
        $ref: '#/definitions/repository.AccountType'
      id:
        type: string
      is_admin:
        type: boolean
      permissions:
        items:
          $ref: '#/definitions/userhandler.DatabasePermission'
        type: array
      username:
        type: string
    type: object
  userhandler.UserSubResponse:
    properties:
      account_type:
        $ref: '#/definitions/repository.AccountType'
      id:
        type: string
      is_admin:
        type: boolean
      username:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  utils.MessageResponse:
    properties:
      message:
        type: string
    type: object
info:
  contact:
    email: denglerchr@gmail.com
    name: Christian Dengler
    url: https://www.swcd.lu
  description: This is a server for a image, audio and file storage with integrated
    web-ui.
  title: SWCD MediaHub-API
  version: 3.1.0
paths:
  /api/logout:
    post:
      consumes:
      - application/json
      description: Revokes a Refresh Token, effectively logging the user out.
      parameters:
      - description: Refresh token JSON body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tokenhandler.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully message
          schema:
            $ref: '#/definitions/utils.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - token
  /api/token:
    post:
      description: Obtains an internal JWT Access/Refresh token pair using HTTP Basic
        Auth.
      produces:
      - application/json
      responses:
        "200":
          description: Returns access and refresh tokens
          schema:
            $ref: '#/definitions/tokenhandler.TokenResponse'
        "401":
          description: Invalid credentials or missing authentication
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get a token pair via Basic Auth
      tags:
      - token
  /api/token/oidc:
    post:
      consumes:
      - application/json
      description: Exchanges an authorization code from an external OIDC provider
        (e.g., Keycloak) for an internal JWT Access/Refresh token pair. Automatically
        provisions new users if necessary.
      parameters:
      - description: OIDC Authorization Code Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tokenhandler.OidcTokenExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns access and refresh tokens
          schema:
            $ref: '#/definitions/tokenhandler.TokenResponse'
        "400":
          description: Invalid request body or OIDC disabled
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Failed to validate OIDC credentials
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Exchange OIDC Authorization Code
      tags:
      - token
  /api/token/refresh:
    post:
      consumes:
      - application/json
      description: Uses a valid Refresh Token to obtain a new Access/Refresh token
        pair.
      parameters:
      - description: Refresh token JSON body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tokenhandler.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access and refresh tokens
          schema:
            $ref: '#/definitions/tokenhandler.TokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Refresh token pair
      tags:
      - token
  /audit:
    get:
      description: Retrieves a paginated list of system audit logs. This endpoint
        provides basic filtering by timestamp and pagination.
      parameters:
      - description: Number of logs to return (default 30)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      - description: Sort order ('asc' or 'desc', default 'desc')
        in: query
        name: order
        type: string
      - description: Start timestamp (Unix milliseconds)
        format: int64
        in: query
        name: tstart
        type: integer
      - description: End timestamp (Unix milliseconds)
        format: int64
        in: query
        name: tend
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns an array of audit log objects
          schema:
            items:
              $ref: '#/definitions/audithandler.AuditLogResponse'
            type: array
        "400":
          description: Invalid parameter formats
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden (Requires IsAdmin role)
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to retrieve audit logs
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      - BearerAuth: []
      summary: Get audit logs
      tags:
      - audit
  /database:
    post:
      consumes:
      - application/json
      description: Creates a new database with custom fields and a dedicated entry
        table.
      parameters:
      - description: Database Metadata
        in: body
        name: database
        required: true
        schema:
          $ref: '#/definitions/databasehandler.DatabaseCreatePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/databasehandler.DatabaseResponse'
        "400":
          description: Invalid request payload or missing name
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Database name already in use
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to create database or storage folder
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Create a new database
      tags:
      - database
  /database/{database_id}:
    delete:
      description: Deletes a database, its entry table, and all of its associated
        entries and metadata.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            $ref: '#/definitions/utils.MessageResponse'
        "400":
          description: Missing database_id path parameter
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to delete database record or folder
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Delete a database
      tags:
      - database
    get:
      description: Retrieves details, custom fields, and statistics for a specific
        database.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/databasehandler.DatabaseResponse'
        "400":
          description: Missing id path parameter
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to calculate stats
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get database details
      tags:
      - database
    put:
      consumes:
      - application/json
      description: Updates the mutable configuration fields for a specific database,
        including its name.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      - description: Configuration and Housekeeping Rules
        in: body
        name: housekeeping
        required: true
        schema:
          $ref: '#/definitions/databasehandler.DatabaseUpdatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/databasehandler.DatabaseResponse'
        "400":
          description: Invalid request payload or missing id path parameter
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to update database
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Update database housekeeping rules or rename
      tags:
      - database
  /database/{database_id}/entries:
    get:
      description: Retrieves a paginated list of entries from a specific database.
        Only supports time-based filters.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      - description: Number of entries to return (default 30)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      - description: Sort order ('asc' or 'desc', default 'desc')
        in: query
        name: order
        type: string
      - description: The field to sort the results by ('timestamp', 'created_at',
          'updated_at', 'id', default 'timestamp')
        in: query
        name: sort_by
        type: string
      - description: The field that tstart and tend should filter against ('timestamp',
          'created_at', 'updated_at', default 'timestamp')
        in: query
        name: time_field
        type: string
      - description: Start timestamp (Unix milliseconds)
        format: int64
        in: query
        name: tstart
        type: integer
      - description: End timestamp (Unix milliseconds)
        format: int64
        in: query
        name: tend
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns an array of entry metadata objects
          schema:
            items:
              $ref: '#/definitions/entryhandler.EntryResponse'
            type: array
        "400":
          description: Missing id param or invalid parameter formats
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden (Requires CanView role)
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Failed to retrieve entries
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get entries from a database (basic)
      tags:
      - database
  /database/{database_id}/entries/delete:
    post:
      consumes:
      - application/json
      description: Deletes multiple entries in a single atomic transaction. Updates
        database statistics only once.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      - description: JSON object containing a list of Entry IDs to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entryhandler.BulkDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Summary of the deletion operation
          schema:
            $ref: '#/definitions/entryhandler.BulkDeleteResponse'
        "400":
          description: Invalid request, missing id, or empty IDs list
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden (Requires CanDelete role)
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Transaction failed
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Bulk delete entries
      tags:
      - database
  /database/{database_id}/entries/export:
    post:
      consumes:
      - application/json
      description: Streams a ZIP archive containing the files and metadata (CSV) for
        the specified entries using io.Pipe.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string
      - description: List of Entry IDs to export
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entryhandler.ExportRequest'
      produces:
      - application/zip
      responses:
        "200":
          description: ZIP Archive containing files and entries.csv
          schema:
            type: file
        "400":
          description: Missing id query parameter or empty IDs list
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden (Requires CanView role)
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: ZIP streaming failed
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Export entries as ZIP
      tags:
      - database
  /database/{database_id}/entries/import:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Accepts a ZIP archive containing media files and an entries.csv metadata file to bulk-import entries into the database.
        The ZIP file is spooled directly to a temporary file on the server's disk to ensure a low memory footprint. Processing happens asynchronously.
      parameters:
      - description: Database ID
        in: path
        name: database_id
        required: true
        type: string

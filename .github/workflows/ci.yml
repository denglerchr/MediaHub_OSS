name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  frontend-quality:
    name: Frontend Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Red/green gates from AI/Reports/Roadmap.md Step 0:
      # `npm run lint && npm run build && npm test` must all run in CI.
      - name: Lint (angular-eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build -- --configuration production

      # The Go binary embeds the built SPA at compile time
      # (cmd/mediahub/main.go: `//go:embed all:frontend_embed/browser`), and that
      # output directory is gitignored (.gitignore: cmd/mediahub/frontend_embed).
      # Publish it so the backend-test job can compile against it (see `needs` below).
      # Purely a hand-off between the two jobs — it lives in the run's artifact
      # storage (not a release/package) and expires after 1 day instead of the
      # 90-day default.
      - name: Upload embedded frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-embed
          path: cmd/mediahub/frontend_embed
          if-no-files-found: error
          retention-days: 1

      # Karma needs a browser: the GitHub-hosted ubuntu runners ship Google
      # Chrome at /usr/bin/google-chrome. Setting CHROME_BIN makes karma.conf.js
      # pick the ChromeHeadless launcher (FirefoxHeadless is the local fallback).
      - name: Unit tests (Karma / ChromeHeadless)
        working-directory: frontend
        run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome

  backend-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    # `go build ./...` compiles cmd/mediahub, which embeds the built SPA via
    # `//go:embed all:frontend_embed/browser`. That directory is gitignored and only
    # produced by `npm run build`, so it is fetched from the frontend job's artifact
    # instead of being rebuilt here.
    needs: frontend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download embedded frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-embed
          path: cmd/mediahub/frontend_embed

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test ./...

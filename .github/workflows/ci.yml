name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  frontend-quality:
    name: Frontend Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Red/green gates from AI/Reports/Roadmap.md Step 0:
      # `npm run lint && npm run build && npm test` must all run in CI.
      - name: Lint (angular-eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build -- --configuration production

      # Karma needs a browser: the GitHub-hosted ubuntu runners ship Google
      # Chrome at /usr/bin/google-chrome. Setting CHROME_BIN makes karma.conf.js
      # pick the ChromeHeadless launcher (FirefoxHeadless is the local fallback).
      - name: Unit tests (Karma / ChromeHeadless)
        working-directory: frontend
        run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome

  backend-test:
    name: Go Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test ./...

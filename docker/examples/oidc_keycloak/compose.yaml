services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: mediahub-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HTTP_MANAGEMENT_PORT: 9000
      KC_HEALTH_ENABLED: true
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 5s

  mediahub:
    build:
      context: ../../../
      dockerfile: docker/Dockerfile
    container_name: mediahub-app
    restart: unless-stopped
    ports:
      - "${MEDIAHUB_PORT:-8080}:8080"
    volumes:
      - mediahub_storage:/storage
    configs:
      - source: mediahub_init
        target: /config/initconfig.toml
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - MEDIAHUB_PASSWORD=${MEDIAHUB_PASSWORD:-password123}
      - MEDIAHUB_AUTH_OIDC_ENABLED=true
      - MEDIAHUB_AUTH_OIDC_DISABLE_LOGIN_PAGE=true
      - MEDIAHUB_AUTH_OIDC_ISSUER_URL=http://localhost:8081/realms/mediahub
      - MEDIAHUB_AUTH_OIDC_CLIENT_ID=mediahub
      - MEDIAHUB_AUTH_OIDC_CLIENT_SECRET=mediahub-secret-1234
      - MEDIAHUB_AUTH_OIDC_DEFAULT_USER_RIGHTS=_oidc_user
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  mediahub_storage:

configs:
  mediahub_init:
    content: |
      [[user]]
      name = "_oidc_user"
      is_admin = false
      is_service_account = true
      password = ""

      [[user.permissions]]
      database_name = "ImageDB"
      can_view = true
      can_create = true
      can_edit = true
      can_delete = false
      can_admin = false

      # --- Databases ---

      [[database]]
      name = "ImageDB"
      content_type = "image"
      config = { create_preview = true, auto_conversion = "webp" }
      housekeeping = { interval = "1h", disk_space = "10G", max_age = "0" }
      # Custom metadata schema
      custom_fields = [
          {name = "location", type = "COORDINATE"},
          {name = "description", type = "TEXT", is_indexed=false}
      ]
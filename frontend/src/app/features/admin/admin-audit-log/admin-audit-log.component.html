<div class="audit-log-container page-container">
  <app-page-header title="System Audit Logs">
    <button
      class="btn btn-outline"
      style="padding: 0.5rem 0.75rem"
      (click)="toggleFilter()"
      title="Toggle Filters"
    >
      <span
        class="badge"
        style="
          background-color: var(--button-primary-bg);
          color: var(--text-primary);
          border-radius: 0.25rem;
          padding: 0.1rem 0.35rem;
          margin-right: 0.35rem;
          font-size: 0.75rem;
          font-weight: bold;
        "
        *ngIf="activeFiltersCount > 0"
        >{{ activeFiltersCount }}</span
      >
      Filter
    </button>
  </app-page-header>

  <div class="filters-container" [class.collapsed]="isFilterCollapsed">
    <div class="form-group flex-1">
      <label class="form-label">Start Date (Local)</label>
      <input
        type="datetime-local"
        class="form-control"
        [(ngModel)]="startDate"
        (ngModelChange)="onDateChange()"
        appDatetimeDefault
      />
    </div>

    <div class="form-group flex-1">
      <label class="form-label">End Date (Local)</label>
      <!-- FE-048: end-of-range default is 23:59 (the generic 00:00 default silently excluded the whole selected day) -->
      <input
        type="datetime-local"
        class="form-control"
        [(ngModel)]="endDate"
        (ngModelChange)="onDateChange()"
        appDatetimeDefault="end"
      />
    </div>

    <div class="filter-actions">
      <button
        class="btn btn-secondary"
        (click)="clearFilters()"
        [disabled]="isLoading || (!startDate && !endDate)"
      >
        Clear Filters
      </button>
      <button class="btn btn-primary btn-refresh" (click)="refresh()" [disabled]="isLoading">
        <img
          src="assets/icons/refresh-icon.svg"
          alt="Refresh"
          class="refresh-icon"
          [class.spin]="isLoading"
        />
        {{ isLoading ? 'Loading...' : 'Refresh' }}
      </button>
    </div>
  </div>

  <div class="scroll-content">
    <div *ngIf="isLoading && logRows.length === 0" class="loading-state">
      <p>Loading audit logs...</p>
    </div>

    <div class="table-wrapper" *ngIf="!isLoading || logRows.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th style="width: 80px">ID</th>
            <th style="width: 200px">Timestamp</th>
            <th style="width: 150px">Action</th>
            <th style="width: 150px">Actor</th>
            <th style="width: 250px">Resource</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="logRows.length === 0 && !isLoading">
            <td colspan="6" class="empty-state text-center">
              No audit logs found matching the criteria.
            </td>
          </tr>

          <tr *ngFor="let log of logRows; trackBy: trackByLogId">
            <td class="log-id">#{{ log.id }}</td>
            <td>{{ log.timestamp | date: 'yyyy-MM-dd HH:mm:ss' }}</td>
            <td>
              <span class="action-badge">{{ log.action }}</span>
            </td>
            <td style="font-weight: 500; color: var(--text-primary)">
              {{ log.actor }}
            </td>
            <td class="resource-text">
              {{ log.resource }}
            </td>
            <td class="details-text">
              {{ log.detailsText }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-controls" *ngIf="logRows.length > 0 || currentPage > 1">
      <button
        class="btn btn-secondary"
        [disabled]="offset === 0 || isLoading"
        (click)="previousPage()"
      >
        &laquo; Previous
      </button>
      <span class="page-indicator">Page {{ currentPage }}</span>
      <button class="btn btn-secondary" [disabled]="!hasNextPage || isLoading" (click)="nextPage()">
        Next &raquo;
      </button>
    </div>
  </div>
</div>

<div class="global-keys-container page-container">
  <div class="sticky-header">
    <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 0">
      <a routerLink="/dashboard" class="back-btn" title="Back to Overview">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1.5em"
          height="1.5em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h2 class="shortened-title" title="Global API Keys">Global API Keys</h2>
    </div>
  </div>

  <div class="scroll-content">
    <div *ngIf="isLoading" class="loading-state">
      <p>Loading global API keys...</p>
    </div>

    <div *ngIf="!isLoading" class="table-card">
      <app-api-key-table
        [keys]="apiKeys"
        [showOwner]="true"
        emptyMessage="No active API keys found in the system."
        revokeTitle="Revoke API Key Globally"
        (editKey)="openEditKeyModal($event)"
        (revokeKey)="openRevokeConfirm($event)"
      ></app-api-key-table>
    </div>
  </div>
</div>

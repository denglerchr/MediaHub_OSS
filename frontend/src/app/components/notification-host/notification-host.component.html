<div *ngIf="globalError" class="global-error-banner" role="alert" aria-live="assertive">
  <div class="global-error-content">
    <span>{{ globalError }}</span>
    <button (click)="clearGlobalError()" class="close-btn" aria-label="Dismiss error">
      &times;
    </button>
  </div>
</div>

<div
  class="toast-live-region"
  [attr.role]="toast?.type === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="toast?.type === 'error' ? 'assertive' : 'polite'"
>
  <div
    *ngIf="toast"
    [@toastAnimation]
    class="toast-notification"
    [ngClass]="{
      'toast-success': toast.type === 'success',
      'toast-error': toast.type === 'error',
      'toast-info': toast.type === 'info',
    }"
  >
    <span>{{ toast.message }}</span>
    <button (click)="clearToast()" class="close-btn" aria-label="Dismiss notification">
      &times;
    </button>
  </div>
</div>
